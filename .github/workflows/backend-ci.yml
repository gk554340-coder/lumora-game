name: LUMORA Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumora_ci?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - name: Check migration status
        run: npx prisma migrate status

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run integration tests
        run: npm test
        env:
          NODE_ENV: test
          LOG_LEVEL: silent
          SESSION_TOKEN_BYTES: "32"
          SESSION_TTL_SECONDS: "3600"
          SESSION_MAX_TOKEN_LENGTH: "1024"
          SESSION_LAST_USED_UPDATE_INTERVAL_SECONDS: "0"
          RATE_LIMIT_MAX: "100000"
          RATE_LIMIT_TIME_WINDOW_MS: "60000"
          AUTH_RATE_LIMIT_MAX: "100000"
          AUTH_RATE_LIMIT_TIME_WINDOW_MS: "60000"

      - name: Build the production image
        run: docker build --tag lumora-backend:ci .

      - name: Build the migration image and run it
        run: |
          docker build --target migrate --tag lumora-migrate:ci .
          docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            lumora-migrate:ci

      - name: Start the production image and check it
        run: |
          docker run --detach --name lumora-backend --network host \
            --env NODE_ENV=production \
            --env PORT=3100 \
            --env DATABASE_URL="$DATABASE_URL" \
            lumora-backend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then
              echo
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "The production image did not become healthy."
              docker logs lumora-backend
              exit 1
            fi
            sleep 2
          done

          # A real request through the compiled app and the database.
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:3100/api/auth/register \
            --header "content-type: application/json" \
            --data "{\"email\":\"smoke-${GITHUB_RUN_ID}@example.test\",\"password\":\"correct-horse-battery-staple\"}" \
            > /dev/null || { docker logs lumora-backend; exit 1; }

          docker stop lumora-backend
